# ==============================================================================
# PhotonShield AI - Phase V0.1 Full RaDICaL Dataset Configuration
# 50-Epoch RTX 5050 GPU Full Dataset Baseline Run
# ==============================================================================

dataset:
  name: radical
  data_path: C:/Users/worka/research/photonpinn/data/radical
  splits_dir: C:/Users/worka/research/photonpinn/data/radical/splits
  synthetic_fallback: false
  sequence_length: 16
  feature_dim: 64
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null
  num_classes: 4
  normalization: db
  seed: 42
  augmentation:
    enabled: false
    amplitude_scale: 0.1
    gaussian_noise_std: 0.02
    temporal_mask_ratio: 0.1
    frame_dropout_prob: 0.1
    temporal_jitter: 1

model:
  input_dim: 64
  hidden_dim: 64
  num_layers: 2
  sequence_length: 16
  num_classes: 4
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.0
  use_attention: false
  backend: auto

fusion:
  fusion_mode: simple

diffusion:
  enabled: false

physics:
  enabled: false

decision:
  enabled: false

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  amp: true
  seed: 42
  early_stopping_patience: 10
  lambda_det: 1.0
  lambda_cls: 1.0
  lambda_ano: 0.5
  device: auto
  checkpoint_dir: C:/Users/worka/research/photonpinn/results/photon_v0/V0_1/checkpoints
  results_dir: C:/Users/worka/research/photonpinn/results/photon_v0/V0_1

export:
  onnx: true
  int8: false
  ternary: false
  target_profile: uno_q
