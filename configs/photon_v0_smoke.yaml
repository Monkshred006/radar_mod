# ==============================================================================
# PhotonShield AI - Phase V0 Smoke Test Configuration
# 1-Epoch RTX 5050 GPU Smoke Test Validation
# ==============================================================================

dataset:
  name: radical
  data_path: C:/Users/worka/research/photonpinn/data/radical
  synthetic_fallback: false
  sequence_length: 16
  feature_dim: 64
  num_classes: 4
  normalization: db
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

model:
  input_dim: 64
  hidden_dim: 64
  num_layers: 2
  sequence_length: 16
  num_classes: 4
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.0
  use_attention: false
  backend: auto

fusion:
  fusion_mode: simple

diffusion:
  enabled: false

physics:
  enabled: false

decision:
  enabled: false

training:
  batch_size: 16
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  amp: true
  max_train_samples: 2000
  max_val_samples: 500
  lambda_det: 1.0
  lambda_cls: 1.0
  lambda_ano: 0.5
  seed: 42
  device: auto
  checkpoint_dir: C:/Users/worka/research/photonpinn/radar/checkpoints/photon_v0_smoke
  results_dir: C:/Users/worka/research/photonpinn/results/photon_v0

export:
  onnx: false
  int8: false
  ternary: false
  target_profile: uno_q
